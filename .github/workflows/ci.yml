name: Checks
on:
  push:
  pull_request:
jobs:
  userscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: git diff --exit-code -- scripts/safari-ai-agent.user.js
