<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swift gateway fixture</title>
</head>
<body>
  <main>
    <h1>Swift gateway fixture</h1>
    <label for="pilot-note">Pilot note</label>
    <input id="pilot-note" type="text" autocomplete="off">
    <p id="status">Status: READY</p>
    <button id="mark-complete" type="button">Mark complete</button>
  </main>
  <script>
    const note = document.querySelector('#pilot-note');
    const status = document.querySelector('#status');
    note.addEventListener('input', () => { status.textContent = 'Status: FILLED'; });
    document.querySelector('#mark-complete').addEventListener('click', () => {
      status.textContent = 'Status: CLICKED';
    });
  </script>
</body>
</html>
