# File: fleet/fleet-registry.yaml (repo-relative; this repo is PUBLIC — see README.md)
# Description: Seats, write scopes and project gates for the safari-ai-agent fleet.
#   Rebuilt 2026-10-25 by operator decision; scoped release and Swift seats added 2026-11-09
#   by operator direction. The prior registry — 667 lines, 27% of it a dead
#   per-session roster — is preserved verbatim at fleet/archive-2026-10-25/fleet-registry.yaml.
#   Nothing was deleted; git history follows every file.
# Author: Libor Ballaty <liborballaty@gmail.com>, with Claude Opus 5 (claude-11, lead seat)
# Created: 2026-10-25

fleet_id: safari-ai-agent
repo: /Users/liborballaty/LocalProjects/GitHubProjectsDocuments/Safari-ai-agent
integration_branch: main
production_branch: main
mailbox: fleet/mailbox              # IN-REPO. The central path is a symlink here.
created: 2026-10-11
rebuilt: 2026-10-25
updated: 2026-11-09

objective: >
  OPERATOR'S STATED GOAL, unchanged since 2026-10-13: "get this working on the iPad reliably."
  That is the priority ordering function for this fleet. Work that does not move iPad
  reliability is secondary, INCLUDING USEFUL WORK. The named gap has not moved: ten-run
  reliability is still zero, and it needs the operator and a physical iPad, not more code.

leadership:
  current_holder: claude-11         # PROVISIONAL AS A LABEL ONLY — see liveness note below.
  authorized_on: 2026-10-25
  authorized_by: Libor Ballaty
  scope: >
    Sets priority against the objective; runs the full gate; integrates; owns D-### numbering
    in docs/DECISIONS.md (peers propose, the lead numbers).
  not_scope: >
    Does NOT carry operator-reserved authority (AGENTS.md §6): widening the gateway origin
    allowlist, exposing a public endpoint, spending money, `git reset`, or accepting a device
    gate as closed. Does NOT redirect a peer mid-task or edit its files — findings go to a peer
    as findings, not orders.
  precedent: >
    Four seat transfers to date. In every one, the incoming lead reconciled with a live peer
    rather than imposing, and NO successor ever rewrote a peer's self-declared entry. On
    2026-10-14 claude-04 stood down voluntarily rather than contest the seat — "two agents
    acting as lead is worse than either one leading." RECONCILE WITH A LIVE PEER, NEVER IMPOSE.

# *** LIVENESS IS NOT IN THIS FILE. ***
# Nothing updates an `occupant:` field when a session exits, and occupancy has no runtime
# representation at all: fleet_identity.py:294-296 couples QUEUECTL_AGENT and AGENT_NAME into
# one `<fleet>-<agent>` string and claude_w.py:636-638 derives the messaging --name from it, so
# a seat IS the runtime identity. This file answers WHAT A SEAT IS FOR. To learn whether anyone
# is sitting in one:
#     python3 ~/.ai-dev-dotfiles/tools/fleet-status.py --fleet safari-ai-agent
seats:
  - id: lead
    poll_key: lead                  # --agent lead -> mailbox/lead.md
    owns:
      - fleet/**
      - docs/DECISIONS.md           # D-### NUMBERING only
    mailbox: {inbox: mailbox/lead.md, outbox: mailbox/lead.status.md}

  - id: implementation
    poll_key: implementation        # --agent implementation -> mailbox/implementation.md
    owns:
      - src/**, gateway/**, tools/**
      - README.md, docs/SETUP-GUIDE.md, docs/GATEWAY-CONTROLS.md, docs/RELEASE_CHECKLIST.md
      - its own mailbox pair
    constraint: >
      Provider feasibility is RESEARCH ONLY. No provider implementation without explicit
      operator approval of a plan.
    mailbox: {inbox: mailbox/implementation.md, outbox: mailbox/implementation.status.md}

  - id: swift-alternate
    poll_key: swift-alternate
    owns:
      - app/**
      - docs/SWIFT-APP-DESIGN.md
      - its own mailbox pair
    constraint: >
      Build the alternate browser-host application for both macOS and iOS. Preserve the
      measured WKWebView passkey limitation and current gateway boundary. No external
      credentials, public exposure changes, paid services, or operator-only device prompts.
    mailbox: {inbox: mailbox/swift-alternate.md, outbox: mailbox/swift-alternate.status.md}

coordination:
  write_policy: reserve-before-write    # AGENTS.md §3; export QUEUECTL_AGENT
  commits: path-form, verify the staged set first, no Co-Authored-By trailers
  branch_guard: >
    `git checkout` is wrapper-blocked in the primary checkout — branch work needs a worktree
    via ~/.ai-dev-dotfiles/tools/setup-worktree.sh. `git reset` is denied to agents entirely
    and must be handed to the operator.
  wake_up: >
    PULL only. fleet-inbox-wait.sh reaches an agent that is looping; it does NOT reach one that
    has ended its turn ("IS NOT a way to be woken after your turn ends" — its own header). The
    push supervisor was DECLINED 2026-10-12 (launch-layer-only), not deferred. tmux is hosting,
    not transport.

gates:
  commands:
    - npm run check          # full Node gate (build + tests + syntax)
    - npm run test:browser   # Playwright/Chromium; needs playwright + chromium
  known_gap: >
    `npm run check` enumerates its `node --check` targets explicitly rather than globbing, so a
    NEW FILE IS NOT SYNTAX-CHECKED AND THE SUITE STAYS GREEN. Add new entry points to that list
    in the same commit that creates them.
  acceptance: >
    A GREEN SUITE IS NOT ACCEPTANCE. D-039 passed its tests and was silent on real hardware;
    that produced D-040. Anything touching the approval path needs a device run.

constraints_not_visible_from_code:
  split_view: >
    Split View is MANDATORY on iPadOS (D-029) and is an ACCEPTED OPERATING LIMIT, not a bug.
    iPadOS suspends a backgrounded tab, the session ages out, page tools fast-fail in ~1 ms.
    No code change lifts it, and the native extension does not either — see
    docs/SERVICE-WORKER-LIFETIME.md.
  passkeys: >
    D-053, measured with a control: passkeys do NOT work in a third-party WKWebView. This
    BOUNDS the Swift path to password-authenticated sites rather than killing it. Stage B — a
    real logged-in session surviving a restart — is therefore the decisive test. Open question
    is the operator's, not an agent's: do the sites that matter use passkeys?

canonical_documents:
  docs/TRACKER.md: Source of truth for delivery state. Implementation evidence, not ideas.
  docs/DECISIONS.md: Decision log. D-### numbers assigned by the lead — propose, don't number.
  docs/PRODUCT_REQUIREMENTS.md: What the product must do.
  docs/IPAD-DEVICE-RUN-SHEET.md: Operator protocol for device sessions.
  README.md: Risks 1–6. Read before any safety-adjacent change.

history:
  archive: fleet/archive-2026-10-25/
  note: >
    The fleet as it stood on 2026-10-25 — registry, README, all mailboxes including retired
    ones, and the full status history of claude-04, claude-9a, codex-01, lead and
    implementation. Moved with `git mv`, so history follows. It is the RECORD: it makes older
    commits interpretable. It is NOT state — do not liveness-check it, and do not poll its
    mailboxes. Prior occupants: claude-safari-ai-agent (10-11), claude-04 (10-13),
    claude-9a (10-14), codex-01 (implementation seat, 10-25), claude-11 (lead, 10-25).
