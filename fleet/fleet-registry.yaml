# ---------------------------------------------------------------------------
# THE iPAD RELIABILITY GATE — added by claude-04 (lead) 2026-10-13 from docs/TRACKER.md.
# This, not `open_defects`, is what stands between today and the operator's stated goal.
# ---------------------------------------------------------------------------
ipad_reliability_gate:
  headline: >
    "Works on iPad" is PROVEN (2026-10-11, 17 tool calls, full workflow, no copy/paste).
    "Works RELIABLY on iPad" has essentially no evidence. The gap is not a bug list.

  r1_ten_run_reliability:
    status: NEVER MEASURED — zero runs
    why_it_dominates: >
      Every success on record is a single run. "Reliably" is precisely the dimension with no
      data. No amount of code review substitutes for the measurement. HIGHEST VALUE NEXT ACTION.
    needs: operator + physical iPad. Not unblockable by an agent alone.

  r2_split_view_is_a_platform_ceiling:
    status: >
      ACCEPTED AS A DOCUMENTED OPERATING LIMIT — operator decision 2026-10-13, verbatim:
      "accept a documented limit for now but then let's scope how and if we can get around
      this in future." Documenting it is codex-01's (README.md, docs/SETUP-GUIDE.md are its
      files); the future-options scoping is the lead's. No longer tracked as a defect.
    was: CHARACTERISED, NOT FIXABLE (D-029)
    detail: >
      iPadOS SUSPENDS a backgrounded Safari tab; the session ages out of the 45s window and
      page-touching tools fast-fail in 1ms. Split View is MANDATORY. macOS differs (hidden tab
      keeps polling, throttled) so macOS testing can never reveal this.
    critical: >
      No code change lifts this, AND the native extension does not either — see
      docs/SERVICE-WORKER-LIFETIME.md: the MV3 worker lives ~30s at a time and the keepalive
      provably cannot restore the session. This is a PRODUCT-SHAPE question, not a bug:
      either the operator accepts "Split View, foreground, don't app-switch" as an operating
      limit, or the product changes shape. OPERATOR DECISION REQUIRED.

  r3_approval_path_fixes_unconfirmed_on_device:
    status: PINNED BY TEST, NEVER TOUCHED BY A THUMB
    items: [D-035 stale-poll ordering, D-036 reachable Stop, D-038 44pt touch targets,
            D-039/D-040 audible+visual approval alert]
    why_it_matters: >
      Approval is on the critical path of EVERY action. If one of these is wrong on hardware,
      reliability is gone regardless of anything else.
    precedent: >
      D-039 ALREADY DID THIS — it passed its tests and was SILENT on real hardware, which is
      what produced D-040. That is direct evidence that the test is not a substitute for a
      device run here. D-035's race is ~1-in-8 and cannot be triggered on demand.

  r4_single_point_of_failure:
    status: ACCEPTED RISK, UNMITIGATED (D-014)
    detail: >
      The entire iPad path depends on Userscripts — App Store-only, effectively
      single-maintainer, in beta since 2026-01. No fallback transport exists on iPadOS.

  r5_native_extension_is_not_the_escape_hatch:
    status: SCAFFOLD — HAS NEVER RUN IN SAFARI, NOT ONCE
    detail: >
      Builds unsigned, assets stage correctly, 15 simulated-teardown tests pass. But poll →
      execute → result has never executed against a real gateway and a real page, and
      enabling an unsigned extension raises a Touch ID sheet an agent must not satisfy.
      Do not treat F-01 as a ready answer to r2 or r4.

  remaining_for_D2_01: [Stop while queued, same-origin recovery, ten-run reliability,
                        independent security review]

  r6_read_everywhere_widens_the_injection_surface:
    status: OPEN — raised by claude-04 (lead) 2026-10-13; needs a D-### and operator confirmation
    context: >
      Operator authorized reading across all websites without the project allowlist. codex-01
      implemented it carefully: readAnyOrigin defaults false, opt-in, re-validates origin shape,
      unlisted origins get read-only policy, no trust or standing grants transfer.
    the_gap: >
      That mitigation stops an untrusted site being ACTED ON. Prompt injection does not need
      that — it works through READING. Sequence: agent reads a malicious page under read-only
      policy (nothing is acted on, policy fully respected); its text enters the model context;
      the same conversation then acts on an allowlisted TRUSTED site where actions are granted.
      Injected instructions and action rights sit in the SAME model context. The gateway cannot
      see it because no policy boundary is crossed there — only inside the model.
    why_it_changed: >
      Before read-everywhere, the origin allowlist bounded what text could ever reach the model
      context. It no longer does. README.md risk #3 already calls injection "the single biggest
      unsolved risk"; the exposure is now materially larger than that text describes.
    actions: >
      (1) README.md risk #3 should state this explicitly. (2) Needs a decision record — lead
      assigns the D-### number, codex-01 proposes. (3) Operator should confirm they understood
      THIS implication specifically, not merely "read everywhere".
    not_a_block: >
      The operator authorized the capability and the implementation is sound. This is an
      accepted-risk architecture choice that must be WRITTEN DOWN, not reversed.
    operator_decision_2026_10_13: >
      ACCEPTED. Operator's reasoning, verbatim: "readonly should be fine as other actions for
      the specific sites are blocked or setup as ask first by default I suppose the question is
      can we set this up so we are configuring the actions available/allowed/ask/denied on a
      per site basis". Partly correct and it points at real work — see per_site_policy_gap.
    lead_caveat_still_standing: >
      Per-site tiers BOUND the blast radius; they do not close the injection path. A page read
      under read-only still puts text in the model context that can steer an action on a
      TRUSTED site in the same conversation. Only the ask-prompt interrupts that, and README
      risk #4 records approval fatigue as a real failure mode. This belongs in the D-### record
      rather than letting "it is read-only" stand as the whole mitigation.

  per_site_policy_gap:
    status: >
      OPERATOR REQUEST 2026-10-13, partially already built. Verified against gateway/server.mjs
      by the lead before answering — not assumed.
    already_done: >
      Capability tiering per site EXISTS and codex-01 has just built its UI: MODES =
      {read-only, fill-only, trusted}, parseSitePolicy(), normalizeMode() collapsing unknown
      values to read-only, and an UNLISTED origin defaulting to the MOST restrictive tier.
      That is substantially D-020.
    the_real_gap: >
      The operator named allowed/ask/denied — an APPROVAL DISPOSITION, a different axis from
      the capability tier. Today that axis is `standingGrants`, a SINGLE GLOBAL BOOLEAN
      (SAFARI_STANDING_GRANTS). There is no per-site "ask every time" vs "allow silently".
      That is D-021 (allow-once vs allow-always, scoped and revocable) and it remains OPEN.
    why_it_matters_most: >
      Ask-first is the only control that actually interrupts a model acting on injected
      instructions (see r6). So D-021 is both what the operator just asked for AND the
      strongest available mitigation for the risk they just accepted.
    assignment: >
      NOT ASSIGNED. Offered to codex-01 as adjacent to its open site-modes UI; equally fine for
      it to finish and hand off. Lead does not redirect a peer mid-task.

open_decisions:
  - "Where does safety policy live — shipped inside the userscript, or delivered by the gateway? Blocks D-019/D-020/D-021."
  - "Product framing: draft-and-review, read-only research, trusted-site completion, or plan-level approval? Blocks gate design."
  - "D-015: Claude requested MCP protocol 2026-07-28; gateway advertises 2025-11-25."
  - "F-01 native Safari Web Extension is now REQUIRED for the stated goal, not Future. Userscripts cannot reach tabs, background or screenshots."
