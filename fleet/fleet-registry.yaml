      because `fleet-nudge.py --watch` would start cleanly, print "Watching inbox:" and wait
      forever on a file nobody writes). THAT DOCUMENT IS CANONICAL for the nudge chain; this
      entry defers to it and exists only to record the duplication.
      It also corrects claude-11: it had written that tmux "is not a channel". Too strong.
      tmux IS the INTENDED cross-harness transport — `fleet-nudge.py` types a trigger sentence
      into the target pane with `send-keys` and reads the screen back before pressing Enter,
      which is harness-agnostic precisely because typing characters into a terminal does not
      care what is reading them. The accurate statement is that the mechanism EXISTS and is NOT
      DEPLOYED (F-1: no launchd job, no live process) and would be MISCONFIGURED if it were
      (F-2). So every cross-harness nudge today is still a human relay — true conclusion, but
      not for the reason claude-11 first gave.
      Both defects sit in operator-owned launch profiles. Neither was fixed here, and
      codex-01's own agents: entry was NOT edited — per the 10-13 note, that is its to correct.

