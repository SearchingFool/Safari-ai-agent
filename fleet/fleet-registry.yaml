# ---------------------------------------------------------------------------
# Repo state at fleet formation. A worker must not have to rediscover this.
# ---------------------------------------------------------------------------
repo_state_at_formation:
  head: d261859
  version: 0.2.1
  proven_2026_10_11: >
    Claude custom remote MCP connector authenticated over public HTTPS (Tailscale Funnel)
    and drove a real browser through a full multi-page workflow: 10 tools/call round trips,
    all HTTP 200, no copy/paste. B1-01, B1-02, C1-01, C2-01 closed; D1-01 closed on macOS.
    ALL OF IT ON macOS SAFARI, NOT THE iPAD. B2-01 and D2-01 remain open.
  gates:
    node: "npm run check   # 23/23 expected, includes build + syntax checks"
    browser: "npm run test:browser   # 4 Chromium suites, needs playwright + chromium"
    diagnostics: "npm run diagnose   # human report over logs/gateway-diagnostics.jsonl"
    live_rig: "SAFARI_EXTRA_ORIGINS=... bash tools/start-mac-tailscale-test.sh"
  ci: "GitHub Actions — two jobs (node checks, playwright browser-integration). Must be green before merge."
  no_dependencies: "Deliberately zero npm runtime/dev dependencies. Do not add any without a decision."

coordination:
  mutex:
    tool: queuectl
    queue: the global agent work queue (outside this repo)
    enforcement: advisory      # the Claude pre-write hook is WARN-ONLY
    gotcha: "release takes --token, not --agent. Capture the token from reserve output."
  commit_rules:
    form: "git commit <path>... -m '...'   # path-form, after verifying the staged set"
    trailers: "NO Co-Authored-By trailers — operator preference."
    secrets: ".env.mac-tailscale and logs/ are gitignored. Never commit a token value."
  known_friction:
    squash_divergence: >
      The lead commits on local main then pushes to a branch ref; GitHub squash-merges,
      so local main diverges by SHA with identical content. Realignment needs
      `git reset --hard origin/main`, which is DENIED to agents — hand it to the operator.
      Workers using real worktrees avoid this entirely.

