      because it is the SAME harness. The 10-13 finding stands unamended: a real Claude<->Codex
      pair still has no direct channel and still needs an operator relay.
      tmux is NOT a communication channel. Per docs/FLEET-TMUX-LAUNCH.md it hosts a named
      terminal a human can attach to; it does not deliver, acknowledge, or recognise prompts.
      Addressing a pane means synthesising keystrokes into a TUI, which that doc gates behind a
      tested adapter probe (`nudgeable: false` until proven) and forbids for approval prompts.
      No such adapter is in use in this fleet. Claude<->Claude messaging works through the
      harness session registry and is independent of tmux entirely.
    findings_superseded_by_claude_04: >
      SUPERSEDED — do not act on my version. claude-11 independently found two defects while
      resolving the channel question (the `codex-01` seat is a Claude process, and its launch
