<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Safari Agent</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      width: 320px;
      color: #1a1a1a;
      background: #fafafa;
    }
    h2 {
      font-size: 16px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 12px;
      background: #e0e0e0;
      color: #424242;
    }
    .status-badge.connected {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .auth-section {
      background: #fff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
      margin-bottom: 12px;
    }
    button {
      background: #10a37f;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
    }
    button:hover {
      background: #0e8c6d;
    }
    textarea {
      width: 100%;
      height: 70px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      margin-bottom: 8px;
      resize: none;
    }
    #log {
      max-height: 120px;
      overflow-y: auto;
      background: #212121;
      color: #76ff03;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      margin-top: 10px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>
    <span>Safari AI Agent</span>
    <span id="authStatus" class="status-badge">Not Signed In</span>
  </h2>

  <div id="authPrompt" class="auth-section">
    <p style="font-size: 12px; margin: 0 0 8px 0; color: #616161;">
      Run directly on your personal ChatGPT Plus/Pro plan.
    </p>
    <button id="loginBtn">Sign in with ChatGPT</button>
  </div>

  <div id="agentInterface" style="display: none;">
    <textarea id="taskInput" placeholder="What should I do on this page? (e.g. 'Search for wireless mice')"></textarea>
    <button id="runBtn">Run Task</button>
  </div>

  <div id="log">Awaiting command...</div>

  <script src="popup.js"></script>
</body>
</html>
