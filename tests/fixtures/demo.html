<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Safari AI Agent Test Page</title>
<style>body{font:16px system-ui;max-width:700px;margin:24px auto;padding:12px}label{display:block;margin:14px 0}input,select,textarea,button{font:inherit;padding:8px}#feedback{background:#eef;border-radius:8px;padding:12px}</style></head>
<body><h1>Safari AI Agent Test Page</h1><p>This local page does not submit data to a server.</p>
<form id="test-form"><label for="person">Name</label><input id="person" name="person" type="text" autocomplete="off"/>
<label for="mail">Email</label><input id="mail" type="email"/><label for="secret">Password (should not be readable or fillable)</label><input id="secret" type="password" value="never-share-me"/>
<label for="kind">Category</label><select id="kind"><option value="">Select...</option><option value="research">Research</option><option value="development">Development</option></select>
<label for="delivery">Preferred delivery time</label><input id="delivery" name="delivery" type="time" min="11:00" max="21:00" step="900"/>
<label for="note">Note</label><textarea id="note"></textarea><button id="save" type="submit">Submit test form</button></form>
<button id="ping" type="button">Show confirmation</button>
<p id="feedback" role="status">No actions yet.</p><a id="next" href="/second.html">Next page</a>
<script>document.querySelector('#ping').addEventListener('click',()=>document.querySelector('#feedback').textContent='Button clicked');
document.querySelector('#test-form').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#feedback').textContent='Test form submitted locally';});</script>
</body></html>
